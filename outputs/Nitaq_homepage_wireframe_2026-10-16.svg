  <text x="82" y="240" class="heading">A clearer path to progress.</text>
  <text x="82" y="277" class="small">Digital SAT preparation, school tuition and language training</text>
  <text x="82" y="305" class="small">with guidance matched to each learner.</text>
  <rect x="82" y="335" width="220" height="55" rx="12" fill="#15803d"/><text x="101" y="369" font-size="17" font-weight="bold" class="white">Start SAT diagnostic</text>
  <rect x="316" y="335" width="180" height="55" rx="12" fill="#fff" stroke="#15803d" stroke-width="2"/><text x="337" y="369" font-size="17" font-weight="bold">Explore programs</text>
  <rect x="752" y="158" width="370" height="265" rx="22" fill="#dce5da"/><text x="815" y="282" class="small">Existing campus or learning photo</text>
  <rect x="40" y="470" width="1120" height="92" rx="18" fill="#e9f2e8"/>
