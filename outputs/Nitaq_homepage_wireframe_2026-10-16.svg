  <rect x="40" y="1410" width="1120" height="97" rx="22" fill="#144626"/><text x="72" y="1451" font-size="26" font-weight="bold" class="white">Ready to plan the next step?</text><text x="72" y="1484" font-size="17" class="white">Assessment · campus visit · WhatsApp</text>
