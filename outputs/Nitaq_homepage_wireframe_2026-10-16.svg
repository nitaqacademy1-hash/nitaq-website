<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc">
  <title id="title">Nitaq Academy proposed homepage hierarchy</title>
  <desc id="desc">A non-production wireframe showing a compact green header, warm-white hero, evidence bar, three core program cards, staff and reviews, campus, institutional logo strip, and final call to action.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#0f2d1e} .small{font-size:18px;fill:#344054} .label{font-size:15px;font-weight:bold;letter-spacing:1.7px;fill:#15803d} .heading{font-size:38px;font-weight:bold} .white{fill:white} .muted{fill:#667085} .line{stroke:#dce5da;stroke-width:2}
  </style>
  <rect width="1200" height="1570" fill="#f7f9f4"/>
  <rect x="40" y="30" width="1120" height="78" rx="17" fill="#144626"/>
